services:
  postgres:
    image: postgres:16
    container_name: wealth-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: wealth
      POSTGRES_USER: wealth_app
      POSTGRES_PASSWORD: wealth_dev_password

    ports:
      - "5432:5432"

    volumes:
      - wealth_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealth_app -d wealth"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wealth_postgres_data: